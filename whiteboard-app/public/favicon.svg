<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="penGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Canvas Board Base with Gradient -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Grid Lines / Whiteboard Canvas -->
  <path d="M16 20h32M16 32h20M16 44h24" stroke="rgba(255,255,255,0.25)" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Sticky Note in corner -->
  <rect x="36" y="26" width="16" height="16" rx="3" fill="#fef08a" transform="rotate(8 36 26)" filter="url(#shadow)"/>
  
  <!-- Stylus / Drawing Pen -->
  <g transform="rotate(-35 32 32)">
    <rect x="29" y="8" width="6" height="28" rx="3" fill="#ffffff" filter="url(#shadow)"/>
    <path d="M29 36l3 7 3-7h-6z" fill="url(#penGrad)"/>
    <circle cx="32" cy="43" r="1.5" fill="#f59e0b"/>
  </g>
</svg>
